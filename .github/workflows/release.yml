name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: pin to SHA - Dependabot will handle this
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Restore
        run: dotnet restore source/TSQLLint.sln
      - name: Build
        run: >
          dotnet build source/TSQLLint.sln
          --configuration Release --no-restore
          /p:Version=${{ github.ref_name }}
      - name: Test
        run: >
          dotnet test source/TSQLLint.sln
          --no-restore
          -property:TargetFramework=net8.0
      - name: Pack NuGet
        run: >
          dotnet pack source/TSQLLint.sln
          --configuration Release --no-build
          -p:VERSION=${{ github.ref_name }}
          --output artifacts
      - name: Build platform artifacts
        run: |
          VERSION=${{ github.ref_name }}
          PLATFORMS=(win-x86 win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-musl-x64 linux-musl-arm64 linux-arm linux-arm64)
          for PLATFORM in "${PLATFORMS[@]}"; do
            dotnet publish source/TSQLLint/TSQLLint.csproj \
              -f net8.0 -c Release -r "$PLATFORM" \
              /p:Version="$VERSION" \
              -o "artifacts/$PLATFORM"
            tar -zcf "artifacts/$PLATFORM.tgz" -C artifacts "$PLATFORM"
            rm -rf "artifacts/$PLATFORM"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts/
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/TSQLLint.${{ github.ref_name }}.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
